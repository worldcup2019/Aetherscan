<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Moto Physics - Full Track Edition</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #focusOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10,15,25,0.95) 0%, rgba(0,0,0,0.98) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            color: #fff; z-index: 100; cursor: pointer; transition: opacity 0.3s;
        }
        #focusOverlay h1 { font-size: 4rem; color: #ff3366; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0px 4px 20px rgba(255, 51, 102, 0.7); margin-bottom: 10px; font-style: italic;}
        #focusOverlay p { font-size: 1.2rem; color: #ccc; }
        
        #hud { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 1.4rem; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #coinDisplay { color: #ffd700; margin-top: 5px; font-size: 1.8rem; }
        #statusDisplay { color: #ff3366; margin-top: 15px; font-size: 2rem; text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
        
        #shopButton { position: absolute; top: 20px; right: 20px; padding: 12px 24px; background: #ff3366; color: #fff; border: none; font-weight: 900; cursor: pointer; z-index: 10; font-size: 1.1rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); transition: 0.2s; text-transform: uppercase; }
        #shopButton:hover { background: #ff5588; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255, 51, 102, 0.4); }
        
        #shopMenu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 15, 20, 0.98); padding: 30px; border-radius: 12px;
            border: 2px solid #ff3366; display: none; z-index: 50; color: white;
            text-align: center; width: 85%; max-width: 750px; box-shadow: 0 20px 50px rgba(255,51,102,0.2);
        }
        .bike-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .bike-card { background: #222; padding: 20px; border-radius: 10px; cursor: pointer; border: 2px solid #444; transition: 0.2s; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .bike-card:hover { border-color: #888; transform: scale(1.02); }
        .bike-card.owned { border-color: #ff3366; }
        .bike-card.equipped { background: #3a2a3a; border-color: #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }
        .bike-card button { background: #fff; color: #000; border: none; padding: 10px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; text-transform: uppercase;}
        .bike-card button:disabled { background: #00ffcc; color: #000; cursor: default; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="focusOverlay" onclick="initGame()">
        <h1>Moto Tracks HTML5</h1>
        <p>Race across whoops, valleys, and massive mixed-in gap jumps!</p>
    </div>

    <div id="hud">
        <div id="levelDisplay">Stage: 1</div>
        <div id="coinDisplay">Coins: 0</div>
        <div id="statusDisplay"></div>
    </div>

    <button id="shopButton" onclick="toggleShop()">Garage Vault</button>

    <div id="shopMenu">
        <h2 style="margin:0; color:#ff3366; font-size:2rem; text-transform:uppercase;">Garage Vault</h2>
        <p style="margin:5px 0 20px 0; color:#aaa;">Wallet: <span id="shopCoins" style="color:#ffd700; font-weight:bold;">0</span> Coins</p>
        <div class="bike-grid" id="bikeGrid"></div>
        <button onclick="toggleShop()" style="margin-top: 25px; padding: 12px 24px; background:#444; color:white; border:none; border-radius:6px; cursor:pointer; font-size:1.1rem; font-weight:bold;">Return to Track</button>
    </div>
</div>

<script>
    // ⚙️ ENGINE & ARCHITECTURE
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let time = 0;
    let particles = [];
    let floatingTexts = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const activeKeys = {};
    window.addEventListener('keydown', (e) => {
        activeKeys[e.code] = true;
        if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
        activeKeys[e.code] = false;
    });

    let walletCoins = 0;
    const bikes = [
        { id: 0, name: "Scrap Kicker", price: 0, color: "#ff9900", accel: 0.35, maxSpeed: 16, rotAccel: 0.0035, weight: 1.0, jump: 5 },
        { id: 1, name: "Airborne Pro", price: 50, color: "#00ffcc", accel: 0.55, maxSpeed: 21, rotAccel: 0.0040, weight: 1.1, jump: 6.5 },
        { id: 2, name: "Featherweight BMX", price: 150, color: "#ff3366", accel: 0.30, maxSpeed: 15, rotAccel: 0.0080, weight: 0.65, jump: 8 },
        { id: 3, name: "Graviton Pulse", price: 400, color: "#9b59b6", accel: 0.75, maxSpeed: 26, rotAccel: 0.0060, weight: 1.2, jump: 7 }
    ];
    let ownedBikes = [0];
    let equippedBike = 0;

    let currentLevel = 1;
    let gameState = "START"; 
    let terrain = [];
    let coins = [];
    let camera = { x: 0, y: 0, targetX: 0, targetY: 0 };
    
    let bike = {
        x: 100, y: 0, vx: 0, vy: 0, 
        angle: 0, vAngle: 0, 
        crashed: false,
        radius: 14,
        wheelRot: 0, pedalAngle: 0,
        suspensionOffset: 0,
        airborne: false,
        totalRotation: 0, lastAngle: 0
    };

    function addFloatingText(x, y, text, color) {
        floatingTexts.push({ x: x, y: y, text: text, color: color, life: 1.0, vy: -2 });
    }

    // 🗺️ PROCEDURAL MIXED-TRACK GENERATOR
    function seededRNG(seed) {
        return function() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }
    }

    function generateLevel(levelIndex) {
        let rng = seededRNG(levelIndex * 88881); 
        terrain = [];
        coins = [];
        particles = [];
        floatingTexts = [];
        
        let cx = -200; 
        let cy = 400;
        let trackLength = 2500 + (levelIndex * 800);
        
        terrain.push({ x: cx, y: cy, gap: false });
        cx += 500; // Long safe starting flat to build speed
        terrain.push({ x: cx, y: cy, gap: false });
        
        while (cx < trackLength) {
            let feature = rng();
            
            if (feature < 0.25) {
                // 25% Chance - MASSIVE GAP JUMP
                let rampWidth = 300 + rng() * 100;
                let rampHeight = 150 + rng() * 150;
                
                for(let i=1; i<=12; i++) {
                    let t = i/12;
                    let curveY = cy - (rampHeight * Math.pow(t, 2.2)); 
                    terrain.push({ x: cx + (rampWidth * t), y: curveY, gap: false });
                }
                cx += rampWidth;
                let lipY = cy - rampHeight;
                
                let p1 = terrain[terrain.length-2];
                let p2 = terrain[terrain.length-1];
                let lipAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                let launchSpeed = 20; 
                let v_x = Math.cos(lipAngle) * launchSpeed;
                let v_y = Math.sin(lipAngle) * launchSpeed;
                let gravity = 0.35 * 1.0; 
                
                for(let t = 8; t <= 55; t += 12) {
                    let coinX = cx + (v_x * t);
                    let coinY = lipY + (v_y * t) + (0.5 * gravity * t * t);
                    coins.push({ x: coinX, y: coinY, collected: false });
                }
                
                terrain.push({ x: cx, y: lipY, gap: true });
                cx += 350 + rng() * 250; 
                cy = lipY + 100 + rng() * 200; 
                
                terrain.push({ x: cx, y: cy, gap: false }); 
                
                for(let i=1; i<=4; i++) {
                    terrain.push({ x: cx + i*60, y: cy + i*25, gap: false });
                }
                cx += 240;
                cy += 100;

            } else if (feature < 0.55) {
                // 30% Chance - MOTOCROSS WHOOPS (Rolling Hills)
                let hillCount = Math.floor(rng() * 3) + 2; 
                for(let h=0; h<hillCount; h++) {
                    let hillWidth = 150 + rng() * 100;
                    let hillHeight = 40 + rng() * 50;
                    
                    // Up the hill
                    cx += hillWidth/2; cy -= hillHeight;
                    terrain.push({ x: cx, y: cy, gap: false });
                    // Coin exactly at the crest
                    coins.push({ x: cx, y: cy - 25, collected: false }); 
                    
                    // Down the hill
                    cx += hillWidth/2; cy += hillHeight;
                    terrain.push({ x: cx, y: cy, gap: false });
                }

            } else if (feature < 0.80) {
                // 25% Chance - HIGH SPEED SPRINT (Slight downhill/flat)
                let sprintDist = 400 + rng() * 300;
                let sprintDrop = rng() * 60; 
                cx += sprintDist;
                cy += sprintDrop;
                terrain.push({ x: cx, y: cy, gap: false });
                
                // One coin right in the middle of the straightaway
                coins.push({ x: cx - sprintDist/2, y: cy - sprintDrop/2 - 20, collected: false });

            } else {
                // 20% Chance - DEEP BOWL / VALLEY
                let bowlWidth = 300 + rng() * 200;
                let bowlDepth = 150 + rng() * 100;
                
                // Drop into bowl
                cx += bowlWidth/3; cy += bowlDepth;
                terrain.push({ x: cx, y: cy, gap: false });
                
                // Bottom flat of bowl
                cx += bowlWidth/3; 
                terrain.push({ x: cx, y: cy, gap: false });
                coins.push({ x: cx - bowlWidth/6, y: cy - 20, collected: false }); // Coin at the bottom
                
                // Climb out of bowl
                cx += bowlWidth/3; cy -= bowlDepth;
                terrain.push({ x: cx, y: cy, gap: false });
            }
        }
        
        terrain.push({ x: trackLength + 1200, y: cy, gap: false, finish: true });
        resetBike();
    }

    function resetBike() {
        bike.x = 100; bike.y = 300;
        bike.vx = 0; bike.vy = 0;
        bike.angle = 0; bike.vAngle = 0;
        bike.wheelRot = 0; bike.pedalAngle = 0;
        bike.crashed = false;
        bike.totalRotation = 0; bike.lastAngle = 0;
        bike.airborne = false;
        gameState = "PLAYING";
        document.getElementById('statusDisplay').innerText = "";
        
        let terr = getTerrainHeightData(bike.x);
        if(terr) {
            bike.y = terr.y - bike.radius;
            bike.angle = terr.angle;
        }
        camera.x = bike.x - canvas.width * 0.35;
        camera.y = bike.y - canvas.height * 0.6;
    }

    // 🚴 ADVANCED VECTOR PHYSICS SIMULATION
    function getTerrainHeightData(x) {
        for (let i = 0; i < terrain.length - 1; i++) {
            if (x >= terrain[i].x && x <= terrain[i+1].x) {
                if (terrain[i].gap) return null; 
                let p1 = terrain[i]; let p2 = terrain[i+1];
                let t = (x - p1.x) / (p2.x - p1.x);
                let y = p1.y + t * (p2.y - p1.y);
                let angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                return { y, angle, finish: p2.finish };
            }
        }
        return null; 
    }

    function spawnParticles(x, y, angle, speed, type) {
        if(Math.random() > 0.4) return;
        if(type === 'dirt') {
            particles.push({
                x: x - 15 * Math.cos(angle), y: y - 15 * Math.sin(angle) + 12,
                vx: -speed * 0.4 * Math.cos(angle) + (Math.random() - 0.5) * 3,
                vy: -speed * 0.4 * Math.sin(angle) - Math.random() * 4,
                life: 1.0, size: Math.random() * 5 + 2, color: "#503015"
            });
        } else if(type === 'fire') {
            let exX = x + Math.cos(angle)*(-22) - Math.sin(angle)*(-2);
            let exY = y + Math.sin(angle)*(-22) + Math.cos(angle)*(-2);
            particles.push({
                x: exX, y: exY,
                vx: -Math.cos(angle)*4 + (Math.random()-0.5), vy: -Math.sin(angle)*4 + (Math.random()-0.5),
                life: 0.8, size: Math.random() * 6 + 3, color: (Math.random()>0.5?"#ff3366":"#00ffcc")
            });
        }
    }

    function updatePhysics() {
        if (gameState !== "PLAYING") return;
        let activeStats = bikes[equippedBike];
        
        bike.vy += 0.35 * activeStats.weight; // Constant Gravity
        
        let nextX = bike.x + bike.vx;
        let nextY = bike.y + bike.vy;
        let terr = getTerrainHeightData(nextX);
        
        // Track Stunt Flips
        if(bike.airborne) {
            let deltaAngle = bike.angle - bike.lastAngle;
            if (deltaAngle > Math.PI) deltaAngle -= Math.PI * 2;
            if (deltaAngle < -Math.PI) deltaAngle += Math.PI * 2;
            bike.totalRotation += deltaAngle;

            if (Math.abs(bike.totalRotation) >= Math.PI * 1.8) { 
                let flipType = bike.totalRotation < 0 ? "BACKFLIP!" : "FRONTFLIP!";
                addFloatingText(bike.x, bike.y - 60, flipType + " +5", "#00ffcc");
                walletCoins += 5;
                updateHUD();
                bike.totalRotation -= Math.sign(bike.totalRotation) * Math.PI * 2;
            }
        }
        bike.lastAngle = bike.angle;

        // Ground Collision & Projection Logic
        if (terr && nextY >= terr.y - bike.radius) {
            
            // Hard Landing / Wreck Detection
            if(bike.airborne) {
                bike.suspensionOffset = Math.min(12, bike.vy); 
                
                let angleDiff = Math.abs(bike.angle - terr.angle);
                angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                
                if (Math.abs(angleDiff) > (Math.PI / 2.3) && bike.vy > 5) {
                    bike.crashed = true;
                    gameState = "CRASHED";
                    document.getElementById('statusDisplay').innerHTML = "WRECKED!<br><span style='font-size:1rem;color:#fff;'>Press SPACE to restart</span>";
                    return;
                }
                bike.airborne = false;
                bike.totalRotation = 0; 
            }
            
            // Snap to surface
            bike.y = terr.y - bike.radius;
            
            // MAGIC: Project vector speed along the sloped terrain to allow launching!
            let currentSpeed = Math.sqrt(bike.vx*bike.vx + bike.vy*bike.vy);
            if (bike.vx < 0) currentSpeed = -currentSpeed; 
            
            // Inputs
            if (activeKeys['ArrowUp'] || activeKeys['KeyW']) {
                currentSpeed += activeStats.accel;
                spawnParticles(bike.x, bike.y, terr.angle, currentSpeed, 'dirt');
                spawnParticles(bike.x, bike.y, terr.angle, currentSpeed, 'fire');
                bike.pedalAngle += 0.5;
            } else {
                bike.pedalAngle += currentSpeed * 0.01; 
            }
            
            if (activeKeys['ArrowDown'] || activeKeys['KeyS']) currentSpeed *= 0.82; // Brake

            currentSpeed *= 0.988; // Ground Friction
            
            // Enforce max speeds
            if (currentSpeed > activeStats.maxSpeed) currentSpeed = activeStats.maxSpeed;
            if (currentSpeed < -activeStats.maxSpeed * 0.5) currentSpeed = -activeStats.maxSpeed * 0.5;
            
            // Overwrite X/Y velocity precisely to the angle of the terrain
            bike.vx = Math.cos(terr.angle) * currentSpeed;
            bike.vy = Math.sin(terr.angle) * currentSpeed; 
            
            // Snap chassis angle
            bike.angle = terr.angle;
            bike.vAngle = 0;
            
            // Bunny Hop overrides vy slightly to detach
            if (activeKeys['Space']) {
                bike.vy -= activeStats.jump;
                bike.vx += Math.cos(bike.angle) * 3;
                bike.y -= 3; 
                bike.airborne = true;
                addFloatingText(bike.x, bike.y - 20, "HOP!", "#fff");
                activeKeys['Space'] = false; 
            }

            // Suspension smoothing
            bike.suspensionOffset += (0 - bike.suspensionOffset) * 0.2;

            if (terr.finish) {
                gameState = "WON";
                document.getElementById('statusDisplay').innerHTML = "STAGE COMPLETE!<br><span style='font-size:1rem;color:#fff;'>Press SPACE for Next Stage</span>";
                if(currentLevel < 30) currentLevel++;
            }

        } else if (!terr && bike.y > 1800) {
            bike.crashed = true;
            gameState = "CRASHED";
            document.getElementById('statusDisplay').innerHTML = "FELL INTO THE ABYSS!<br><span style='font-size:1rem;color:#fff;'>Press SPACE to restart</span>";
            return;
        } else {
            // AIRBORNE STATE
            bike.airborne = true;
            bike.suspensionOffset += (0 - bike.suspensionOffset) * 0.1; // Extend shocks
            
            if (activeKeys['ArrowLeft'] || activeKeys['KeyA']) bike.vAngle -= activeStats.rotAccel;
            if (activeKeys['ArrowRight'] || activeKeys['KeyD']) bike.vAngle += activeStats.rotAccel;
            
            bike.vAngle *= 0.97; // Rotational air drag
            bike.angle += bike.vAngle;
            bike.y = nextY; // Freefall dictates Y
            
            bike.pedalAngle += 0.05; // Coasting
        }
        
        bike.wheelRot += bike.vx * 0.08;
        bike.x += bike.vx; // Free movement applies to X

        // Trajectory Coin Collection
        for (let i = 0; i < coins.length; i++) {
            if (!coins[i].collected) {
                // Increased hitbox radius so you don't miss them at high speeds
                let dist = Math.hypot(bike.x - coins[i].x, (bike.y - 15) - coins[i].y);
                if (dist < 75) { 
                    coins[i].collected = true;
                    walletCoins++;
                    updateHUD();
                    addFloatingText(coins[i].x, coins[i].y, "+1", "#ffd700");
                }
            }
        }

        // Particle updates
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            if(p.color === "#503015") p.vy += 0.2; 
            p.life -= (p.color==="#503015" ? 0.04 : 0.08); 
            if(p.life <= 0) particles.splice(i, 1);
        }
        for(let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.life -= 0.02;
            if(ft.life <= 0) floatingTexts.splice(i, 1);
        }
        
        // Smooth cinematic camera 
        camera.targetX = bike.x - canvas.width * 0.35 + (bike.vx * 15);
        camera.targetY = bike.y - canvas.height * 0.6 + (bike.vy * 8);
        if(camera.targetY > 1000) camera.targetY = 1000;
        
        camera.x += (camera.targetX - camera.x) * 0.12;
        camera.y += (camera.targetY - camera.y) * 0.12;
    }

    // 🎨 HIGH-PERFORMANCE RENDERING
    function drawParallax(scrollFactor, color, yBase, amplitude, freq) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startX = -((camera.x * scrollFactor) % (Math.PI * 2 / freq));
        ctx.moveTo(-100, canvas.height);
        for (let x = -100; x < canvas.width + 100; x += 50) {
            let worldX = (camera.x * scrollFactor) + x;
            let y = yBase + Math.sin(worldX * freq) * amplitude;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width + 100, canvas.height);
        ctx.fill();
    }

    function draw() {
        time += 0.05;
        
        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, "#08101a"); 
        skyGrad.addColorStop(0.5, "#1b2a47"); 
        skyGrad.addColorStop(1, "#36162a"); 
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawParallax(0.1, "#101a2a", canvas.height * 0.5, 120, 0.0015); 
        drawParallax(0.25, "#180a15", canvas.height * 0.7, 80, 0.003); 

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Render Terrain
        ctx.beginPath();
        let firstRender = true;
        for (let i = 0; i < terrain.length; i++) {
            let pt = terrain[i];
            if (pt.gap) {
                ctx.lineTo(pt.x, 3000); ctx.lineTo(pt.x, 3000); firstRender = true;
            } else {
                if (firstRender) {
                    ctx.moveTo(pt.x, 3000); ctx.lineTo(pt.x, pt.y); firstRender = false;
                } else {
                    ctx.lineTo(pt.x, pt.y);
                }
            }
        }
        ctx.lineTo(terrain[terrain.length-1].x, 3000);
        
        ctx.fillStyle = '#111'; // Black void ground
        ctx.fill();
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#ff3366'; // Neon outline
        ctx.lineJoin = "round";
        ctx.stroke();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#660022'; 
        ctx.stroke();

        let lastPt = terrain[terrain.length-1];
        ctx.fillStyle = "#fff";
        ctx.fillRect(lastPt.x - 20, lastPt.y - 150, 8, 150);
        for(let i=0; i<7; i++) {
            ctx.fillStyle = (i%2===0) ? "#00ffcc" : "#111";
            ctx.fillRect(lastPt.x - 20, lastPt.y - 140 + (i*20), 50, 20);
        }

        // Draw Coins (Glowing)
        for (let c of coins) {
            if (!c.collected) {
                let hoverY = c.y + Math.sin(time + c.x) * 5;
                ctx.fillStyle = "rgba(255, 215, 0, 0.2)";
                ctx.beginPath(); ctx.arc(c.x, hoverY, 20, 0, Math.PI * 2); ctx.fill(); // Glow
                ctx.fillStyle = "#ffd700";
                ctx.beginPath(); ctx.arc(c.x, hoverY, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.beginPath(); ctx.arc(c.x - 4, hoverY - 4, 4, 0, Math.PI * 2); ctx.fill(); // Shine
            }
        }

        for(let p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Draw Bike
        ctx.save();
        ctx.translate(bike.x, bike.y);
        ctx.rotate(bike.angle);

        let activeBike = bikes[equippedBike];
        
        if (bike.crashed) {
            ctx.fillStyle = "#ff3366"; ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = activeBike.color; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(-20, 10); ctx.lineTo(10, 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(5, -10); ctx.lineTo(30, -5); ctx.stroke();
        } else {
            let susp = bike.suspensionOffset;
            const drawWheel = (wx, wy) => {
                ctx.save();
                ctx.translate(wx, wy);
                ctx.rotate(bike.wheelRot);
                ctx.strokeStyle = '#111'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.stroke(); 
                ctx.strokeStyle = activeBike.color; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI*2); ctx.stroke(); 
                ctx.lineWidth = 2; ctx.strokeStyle = "#888";
                for(let i=0; i<4; i++) {
                    ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.stroke();
                    ctx.rotate(Math.PI / 4);
                }
                ctx.restore();
            };

            drawWheel(-18, 0);
            drawWheel(18, 0);
            
            ctx.translate(0, susp);
            
            ctx.strokeStyle = "#ccc"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(18, -susp); ctx.lineTo(10, -20); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(-18, -susp); ctx.lineTo(-10, -15); ctx.stroke(); 
            
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.strokeStyle = activeBike.color; ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(-10, -15); 
            ctx.lineTo(2, -18);   
            ctx.lineTo(10, -20);  
            ctx.lineTo(4, -5);    
            ctx.lineTo(-5, -5);   
            ctx.closePath();
            ctx.stroke();
            
            ctx.fillStyle = "#555"; ctx.fillRect(-4, -6, 10, 8);
            ctx.strokeStyle = "#888"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(-22, -2); ctx.stroke();

            // Rider Kinematics
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
            
            let cx_pedal = -2, cy_pedal = -5, radius = 5;
            let footX = cx_pedal + Math.cos(bike.pedalAngle) * radius;
            let footY = cy_pedal + Math.sin(bike.pedalAngle) * radius;
            let hipX = -2, hipY = -24 - (bike.vx * 0.15); 
            
            let dx = footX - hipX, dy = footY - hipY;
            let dist = Math.hypot(dx, dy);
            let midX = hipX + dx * 0.5, midY = hipY + dy * 0.5;
            let kneeOffset = Math.sqrt(Math.max(0, 120 - (dist*dist/4))); 
            let kneeX = midX + (dy / dist) * kneeOffset;
            let kneeY = midY - (dx / dist) * kneeOffset;

            ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kneeX, kneeY); ctx.lineTo(footX, footY); ctx.stroke();

            let shoulderX = 8 + (bike.vx * 0.1), shoulderY = -37 + (bike.vx * 0.1);
            ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(shoulderX, shoulderY); ctx.stroke();

            let handsX = 10, handsY = -20;
            let armMidX = (shoulderX + handsX)/2 + 3, armMidY = (shoulderY + handsY)/2 - 3;
            ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(armMidX, armMidY); ctx.lineTo(handsX, handsY); ctx.stroke();

            ctx.fillStyle = activeBike.color;
            ctx.beginPath(); ctx.arc(shoulderX + 5, shoulderY - 6, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#111";
            ctx.beginPath(); ctx.arc(shoulderX + 7, shoulderY - 5, 5, -Math.PI/3, Math.PI/3); ctx.fill();
        }
        ctx.restore();
        
        for(let ft of floatingTexts) {
            ctx.globalAlpha = ft.life;
            ctx.fillStyle = ft.color;
            ctx.font = "bold 26px 'Segoe UI'";
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.lineWidth = 2; ctx.strokeStyle = "#000";
            ctx.strokeText(ft.text, ft.x, ft.y);
        }
        ctx.globalAlpha = 1.0;

        ctx.restore();
    }

    function updateHUD() {
        document.getElementById('levelDisplay').innerText = "Stage: " + currentLevel + " / 30";
        document.getElementById('coinDisplay').innerText = "Coins: " + walletCoins;
        document.getElementById('shopCoins').innerText = walletCoins;
    }

    function gameLoop() {
        updatePhysics();
        draw();
        if (gameState === "CRASHED" || gameState === "WON") {
            if (activeKeys['Space']) {
                activeKeys['Space'] = false; 
                if(currentLevel <= 30) generateLevel(currentLevel);
            }
        }
        requestAnimationFrame(gameLoop);
    }

    function initGame() {
        if(document.getElementById('focusOverlay').style.display === 'none') return;
        document.getElementById('focusOverlay').style.opacity = '0';
        setTimeout(() => document.getElementById('focusOverlay').style.display = 'none', 300);
        generateLevel(currentLevel);
        updateHUD();
        requestAnimationFrame(gameLoop);
    }

    function toggleShop() {
        let shop = document.getElementById('shopMenu');
        if (shop.style.display === 'none' || shop.style.display === '') {
            shop.style.display = 'block'; renderShop();
        } else {
            shop.style.display = 'none';
        }
    }

    function renderShop() {
        let grid = document.getElementById('bikeGrid');
        grid.innerHTML = '';
        bikes.forEach((b) => {
            let isOwned = ownedBikes.includes(b.id);
            let isEquipped = equippedBike === b.id;
            let card = document.createElement('div');
            card.className = 'bike-card' + (isOwned ? ' owned' : '') + (isEquipped ? ' equipped' : '');
            
            let actionBtn = isEquipped ? `<button disabled>EQUIPPED</button>` 
                : (isOwned ? `<button onclick="equipBike(${b.id})">EQUIP</button>` 
                : `<button onclick="buyBike(${b.id})">BUY - ${b.price} COINS</button>`);

            card.innerHTML = `
                <div style="color:${b.color}; font-weight:900; font-size:1.3rem; text-transform:uppercase;">${b.name}</div>
                <div style="font-size:0.9rem; color:#ccc; margin:15px 0; text-align:left; padding-left:10px; border-left:3px solid ${b.color};">
                    Top Speed: <span style="float:right; color:#fff;">${b.maxSpeed}</span><br>
                    Acceleration: <span style="float:right; color:#fff;">${(b.accel*100).toFixed(0)}</span><br>
                    Jump Power: <span style="float:right; color:#fff;">${b.jump}</span><br>
                    Handling: <span style="float:right; color:#fff;">${(b.rotAccel*1000).toFixed(0)}</span>
                </div>
                ${actionBtn}
            `;
            grid.appendChild(card);
        });
    }

    function buyBike(id) {
        let bikeData = bikes.find(b => b.id === id);
        if (walletCoins >= bikeData.price) {
            walletCoins -= bikeData.price;
            ownedBikes.push(id); equipBike(id); updateHUD();
        } else {
            alert("Not enough coins! Navigate the track perfectly to collect more.");
        }
    }

    function equipBike(id) {
        equippedBike = id; renderShop(); bike.vAngle = 0; 
    }
</script>
