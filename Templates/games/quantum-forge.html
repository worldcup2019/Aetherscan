<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Swarm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .score-container {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .health-bar-container {
            width: 250px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500, #00ff66);
            transition: width 0.1s ease-out;
            box-shadow: 0 0 10px #00ff66;
        }
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 13, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f0ff, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            text-transform: uppercase;
        }
        p {
            font-size: 18px;
            color: #a0a0c0;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }
        .btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 700;
            color: #05050d;
            background: #00f0ff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }
        .controls-info {
            margin-top: 30px;
            font-size: 14px;
            color: #606080;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="hud">
                <div class="score-container">SCORE: <span id="score">0</span></div>
                <div class="health-bar-container">
                    <div id="health-bar" class="health-bar-fill"></div>
                </div>
            </div>
        </div>

        <div id="start-screen" class="screen-overlay">
            <h1>Nebula Swarm</h1>
            <p>Defend your vessel against relentless swarm drones. Collect energy orbs to increase your score.</p>
            <button id="start-btn" class="btn">Engage</button>
            <div class="controls-info">
                <strong>WASD / Arrows:</strong> Move Ship &nbsp;|&nbsp; <strong>Mouse:</strong> Aim &amp; Shoot
            </div>
        </div>

        <div id="gameover-screen" class="screen-overlay hidden">
            <h1>Ship Destroyed</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn" class="btn">Re-Deploy</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const healthBarEl = document.getElementById('health-bar');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const keys = {};
        const mouse = { x: width / 2, y: height / 2, down: false };

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);

        let gameState = 'START';
        let score = 0;
        let lastTime = 0;
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 1000;
        let pickupSpawnTimer = 0;
        let pickupSpawnInterval = 3000;
        let gameTime = 0;

        class Player {
            constructor() {
                this.x = width / 2;
                this.y = height / 2;
                this.radius = 18;
                
                // Tuned down parameters for less sensitive movement
                this.acceleration = 0.35; // Lower impulse force (was ~1.0)
                this.maxSpeed = 4.2;      // Capped maximum velocity (was unlimited)
                this.friction = 0.88;      // Higher resistance for quicker, smoother stopping (was 0.92)
                
                this.vx = 0;
                this.vy = 0;
                this.angle = 0;
                this.maxHealth = 100;
                this.health = 100;
                this.fireRate = 120;
                this.lastShot = 0;
            }

            update(dt) {
                let dx = 0;
                let dy = 0;
                if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                // Apply gradual acceleration
                this.vx += dx * this.acceleration;
                this.vy += dy * this.acceleration;

                // Cap max velocity to prevent uncontrolled runaway speed
                const currentSpeed = Math.hypot(this.vx, this.vy);
                if (currentSpeed > this.maxSpeed) {
                    this.vx = (this.vx / currentSpeed) * this.maxSpeed;
                    this.vy = (this.vy / currentSpeed) * this.maxSpeed;
                }

                // Apply smooth drag/friction
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                // Wrap-around bounds
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

                if (mouse.down && Date.now() - this.lastShot > this.fireRate) {
                    this.shoot();
                    this.lastShot = Date.now();
                }
            }

            shoot() {
                const noseX = this.x + Math.cos(this.angle) * this.radius;
                const noseY = this.y + Math.sin(this.angle) * this.radius;
                projectiles.push(new Projectile(noseX, noseY, this.angle));
                createMuzzleFlash(noseX, noseY, this.angle);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 15;

                ctx.fillStyle = '#00f0ff';
                ctx.beginPath();
                ctx.moveTo(this.radius, 0);
                ctx.lineTo(-this.radius * 0.7, -this.radius * 0.7);
                ctx.lineTo(-this.radius * 0.4, 0);
                ctx.lineTo(-this.radius * 0.7, this.radius * 0.7);
                ctx.closePath();
                ctx.fill();

                if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
                    ctx.fillStyle = '#ff5500';
                    ctx.beginPath();
                    ctx.moveTo(-this.radius * 0.4, 0);
                    ctx.lineTo(-this.radius * 1.1, -this.radius * 0.3);
                    ctx.lineTo(-this.radius * 1.1, this.radius * 0.3);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.speed = 12;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.radius = 4;
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.markedForDeletion = false;

                if (type === 'FAST') {
                    this.radius = 12;
                    this.speed = 3.0;
                    this.health = 1;
                    this.color = '#ff0055';
                    this.scoreValue = 150;
                } else if (type === 'TANK') {
                    this.radius = 28;
                    this.speed = 1.0;
                    this.health = 5;
                    this.color = '#aa00ff';
                    this.scoreValue = 300;
                } else {
                    this.radius = 18;
                    this.speed = 1.8;
                    this.health = 2;
                    this.color = '#ff9900';
                    this.scoreValue = 100;
                }
            }

            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                
                if (this.type === 'FAST') {
                    ctx.moveTo(this.x + this.radius, this.y);
                    ctx.lineTo(this.x - this.radius, this.y - this.radius * 0.6);
                    ctx.lineTo(this.x - this.radius, this.y + this.radius * 0.6);
                } else if (this.type === 'TANK') {
                    for (let i = 0; i < 6; i++) {
                        const a = (Math.PI / 3) * i;
                        const px = this.x + Math.cos(a) * this.radius;
                        const py = this.y + Math.sin(a) * this.radius;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                } else {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                }
                
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Pickup {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.markedForDeletion = false;
                this.pulse = 0;
            }

            update() {
                this.pulse += 0.05;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 10 + Math.sin(this.pulse) * 5;
                ctx.fillStyle = '#00ff66';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + Math.sin(this.pulse) * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.speed = this.size * 0.2;
            }

            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.y = 0;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        let player;
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let pickups = [];
        let stars = [];

        for (let i = 0; i < 150; i++) {
            stars.push(new Star());
        }

        function createMuzzleFlash(x, y, angle) {
            for (let i = 0; i < 5; i++) {
                const p = new Particle(x, y, '#00f0ff');
                p.vx = Math.cos(angle + (Math.random() - 0.5)) * (Math.random() * 4 + 2);
                p.vy = Math.sin(angle + (Math.random() - 0.5)) * (Math.random() * 4 + 2);
                particles.push(p);
            }
        }

        function createExplosion(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function spawnEnemy() {
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -30 : width + 30;
                y = Math.random() * height;
            } else {
                x = Math.random() * width;
                y = Math.random() < 0.5 ? -30 : height + 30;
            }

            const rand = Math.random();
            let type = 'STANDARD';
            if (gameTime > 15 && rand < 0.3) type = 'FAST';
            else if (gameTime > 30 && rand > 0.8) type = 'TANK';

            enemies.push(new Enemy(x, y, type));
        }

        function spawnPickup() {
            const x = Math.random() * (width - 100) + 50;
            const y = Math.random() * (height - 100) + 50;
            pickups.push(new Pickup(x, y));
        }

        function checkCollisions() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dist = Math.hypot(p.x - e.x, p.y - e.y);
                    if (dist < p.radius + e.radius) {
                        e.health--;
                        p.markedForDeletion = true;
                        createExplosion(p.x, p.y, '#ffffff', 5);

                        if (e.health <= 0) {
                            e.markedForDeletion = true;
                            createExplosion(e.x, e.y, e.color, 25);
                            score += e.scoreValue;
                            scoreEl.textContent = score;
                        }
                        break;
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < player.radius + e.radius) {
                    e.markedForDeletion = true;
                    createExplosion(e.x, e.y, e.color, 20);
                    player.health -= 20;
                    if (player.health < 0) player.health = 0;
                    updateHealthBar();

                    if (player.health <= 0) {
                        endGame();
                    }
                }
            }

            for (let i = pickups.length - 1; i >= 0; i--) {
                const pk = pickups[i];
                const dist = Math.hypot(player.x - pk.x, player.y - pk.y);
                if (dist < player.radius + pk.radius) {
                    pk.markedForDeletion = true;
                    createExplosion(pk.x, pk.y, '#00ff66', 15);
                    score += 500;
                    scoreEl.textContent = score;
                    if (player.health < player.maxHealth) {
                        player.health = Math.min(player.maxHealth, player.health + 15);
                        updateHealthBar();
                    }
                }
            }
        }

        function updateHealthBar() {
            const pct = (player.health / player.maxHealth) * 100;
            healthBarEl.style.width = pct + '%';
        }

        function initGame() {
            player = new Player();
            projectiles = [];
            enemies = [];
            particles = [];
            pickups = [];
            score = 0;
            gameTime = 0;
            enemySpawnInterval = 1000;
            scoreEl.textContent = '0';
            updateHealthBar();
        }

        function startGame() {
            initGame();
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            createExplosion(player.x, player.y, '#00f0ff', 50);
            finalScoreEl.textContent = score;
            gameoverScreen.classList.remove('hidden');
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') {
                ctx.fillStyle = 'rgba(5, 5, 13, 0.2)';
                ctx.fillRect(0, 0, width, height);
                particles.forEach(p => p.update());
                particles.forEach(p => p.draw());
                particles = particles.filter(p => p.alpha > 0);
                if (gameState === 'GAMEOVER') requestAnimationFrame(gameLoop);
                return;
            }

            const dt = timestamp - lastTime;
            lastTime = timestamp;
            gameTime += dt / 1000;

            enemySpawnTimer += dt;
            const currentInterval = Math.max(250, enemySpawnInterval - gameTime * 10);
            if (enemySpawnTimer > currentInterval) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            pickupSpawnTimer += dt;
            if (pickupSpawnTimer > pickupSpawnInterval) {
                spawnPickup();
                pickupSpawnTimer = 0;
            }

            player.update(dt);
            projectiles.forEach(p => p.update());
            enemies.forEach(e => e.update());
            particles.forEach(p => p.update());
            pickups.forEach(pk => pk.update());
            stars.forEach(s => s.update());

            checkCollisions();

            projectiles = projectiles.filter(p => !p.markedForDeletion);
            enemies = enemies.filter(e => !e.markedForDeletion);
            particles = particles.filter(p => p.alpha > 0);
            pickups = pickups.filter(pk => !pk.markedForDeletion);

            ctx.fillStyle = '#05050d';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(s => s.draw());
            pickups.forEach(pk => pk.draw());
            projectiles.forEach(p => p.draw());
            enemies.forEach(e => e.draw());
            particles.forEach(p => p.draw());
            player.draw();

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        ctx.fillStyle = '#05050d';
        ctx.fillRect(0, 0, width, height);
        stars.forEach(s => s.draw());
    </script>
</body>
</html>
